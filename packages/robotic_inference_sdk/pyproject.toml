[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "robotic-inference-sdk"
version = "0.1.0"
description = "Launch helpers for application-owned platform pipelines"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]
[project.optional-dependencies]
test = ["pytest>=7", "numpy>=1.23"]
[tool.setuptools.packages.find]
where = ["src"]
